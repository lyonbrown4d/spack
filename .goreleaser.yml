version: 2

project_name: spack

before:
  hooks:
    - go mod tidy -diff
    - go -C build mod tidy -diff
    - go work sync

builds:
  - id: spack-runtime-linux
    main: ./cmd/spack-runtime
    binary: spack-runtime
    flags:
      - -trimpath
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -buildid=
  - id: spack-runtime-darwin
    main: ./cmd/spack-runtime
    binary: spack-runtime
    flags:
      - -trimpath
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -buildid=
  - id: spack-runtime-windows
    main: ./cmd/spack-runtime
    binary: spack-runtime
    flags:
      - -trimpath
    goos:
      - windows
    goarch:
      - amd64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -buildid=
  - id: spack-compiler-linux
    main: ./cmd/spack-compiler
    binary: spack-compiler
    flags:
      - -trimpath
    tags:
      - spack_libvips
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -w -buildid=

upx:
  - enabled: true
    ids:
      - spack-runtime-linux
      - spack-runtime-windows
      - spack-compiler-linux
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    compress: best
    lzma: true
    brute: true

release:
  prerelease: auto
  name_template: "{{ .ProjectName }} {{ .Version }}"
  footer: |
    This release is generated by GoReleaser.
  draft: false

changelog:
  use: github
  sort: desc

archives:
  - id: spack-runtime
    ids:
      - spack-runtime-linux
      - spack-runtime-darwin
      - spack-runtime-windows
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}Darwin
      {{- else if eq .Os "linux" }}Linux
      {{- else if eq .Os "windows" }}Windows
      {{- else }}{{ .Os }}
      {{- end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}
      {{- end }}
  - id: spack-compiler
    ids:
      - spack-compiler-linux
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}-compiler_{{ .Version }}_
      {{- if eq .Os "darwin" }}Darwin
      {{- else if eq .Os "linux" }}Linux
      {{- else if eq .Os "windows" }}Windows
      {{- else }}{{ .Os }}
      {{- end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}
      {{- end }}

nfpms:
  - id: spack-runtime-linux-packages
    package_name: spack-runtime
    ids:
      - spack-runtime-linux
    vendor: lyonbrown4d
    homepage: https://github.com/lyonbrown4d/spack
    maintainer: SPACK maintainers <security@lyonbrown.dev>
    description: Container-first static asset runtime for SPA and frontend build outputs.
    license: Apache-2.0
    bindir: /usr/bin
    formats:
      - apk
      - deb
      - rpm

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Version }}-snapshot"

dockers_v2:
  - id: debian
    ids:
      - spack-runtime-linux
    dockerfile: docker/debian.Dockerfile
    images:
      - ghcr.io/lyonbrown4d/spack
      - lyonbrown4d/spack
    tags:
      - "{{ .Tag }}"
      - latest
      - debian
      - debian-{{ .Tag }}
