name: Performance

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main
  schedule:
    - cron: '41 4 * * 2'

permissions:
  contents: read

jobs:
  contract:
    name: Performance contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go 1.27
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libvips dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libvips-dev
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"

      - name: Install task runner
        run: go install github.com/go-task/task/v3/cmd/task@v3.45.4

      - name: Run PR performance contract
        if: github.event_name == 'pull_request'
        run: task perf:contract:pr

      - name: Run main performance contract
        if: github.event_name != 'pull_request'
        run: task perf:contract:main

      - name: Upload performance report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-contract-${{ github.run_id }}
          path: |
            tmp/perf/results/go-bench.txt
            tmp/perf/results/metadata.json
            tmp/perf/results/performance-report.md
          if-no-files-found: error
