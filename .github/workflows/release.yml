name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Release Binaries and Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.26
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            build/go.sum
            go.work.sum

      - name: Install libvips dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libvips-dev upx-ucl
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"

      - name: Run race tests
        run: go test -race ./...

      - name: Run libvips image tests
        run: go test -tags=spack_libvips ./internal/pipeline

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./...

      - name: Install task runner
        run: go install github.com/go-task/task/v3/cmd/task@v3.45.4

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4

      - name: Run release preflight
        run: task release:preflight

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.15.4
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Alpine release image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file docker/alpine.Dockerfile \
            --tag ghcr.io/lyonbrown4d/spack:alpine-${GITHUB_REF_NAME} \
            --tag ghcr.io/lyonbrown4d/spack:alpine \
            --tag lyonbrown4d/spack:alpine-${GITHUB_REF_NAME} \
            --tag lyonbrown4d/spack:alpine \
            --push \
            .

      - name: Scan release image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/lyonbrown4d/spack:${{ github.ref_name }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan Alpine release image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/lyonbrown4d/spack:alpine-${{ github.ref_name }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate CycloneDX image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/lyonbrown4d/spack:${{ github.ref_name }}
          format: cyclonedx
          output: spack-${{ github.ref_name }}.cyclonedx.json

      - name: Generate CycloneDX Alpine image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/lyonbrown4d/spack:alpine-${{ github.ref_name }}
          format: cyclonedx
          output: spack-${{ github.ref_name }}-alpine.cyclonedx.json

      - name: Upload SBOM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "spack-${GITHUB_REF_NAME}.cyclonedx.json" "spack-${GITHUB_REF_NAME}-alpine.cyclonedx.json" --clobber

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign release images
        run: |
          cosign sign --yes \
            ghcr.io/lyonbrown4d/spack:${GITHUB_REF_NAME} \
            ghcr.io/lyonbrown4d/spack:alpine-${GITHUB_REF_NAME} \
            ghcr.io/lyonbrown4d/spack:debian-${GITHUB_REF_NAME} \
            lyonbrown4d/spack:${GITHUB_REF_NAME} \
            lyonbrown4d/spack:alpine-${GITHUB_REF_NAME} \
            lyonbrown4d/spack:debian-${GITHUB_REF_NAME}

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*

      - name: Run release performance contract
        run: task perf:contract:release

      - name: Upload performance report to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" tmp/perf/results/* tmp/k6/results/*.json --clobber
