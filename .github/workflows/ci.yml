name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go 1.26
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            build/go.sum
            go.work.sum

      - name: Install task runner
        run: go install github.com/go-task/task/v3/cmd/task@v3.45.4

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Check workspace modules
        run: task release:preflight

      - name: Run lint
        run: task lint

      - name: Run check
        run: task check

      - name: Run tests
        run: task test

      - name: Run libvips image tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libvips-dev libheif-plugin-aomenc
          CGO_ENABLED=1 task test:libvips

      - name: Run race tests
        if: runner.os == 'Linux'
        run: task test:race

      - name: Run govulncheck
        if: runner.os == 'Linux'
        run: task security:govulncheck

      - name: Run build
        run: task build

      - name: Run container smoke test
        if: runner.os == 'Linux'
        run: task integration:container:smoke
