name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install task runner
        run: go install github.com/go-task/task/v3/cmd/task@v3.45.4

      - name: Run lint
        run: task lint

      - name: Run check
        run: task check

      - name: Run tests
        run: task test

      - name: Run build
        run: task build
