# https://taskfile.dev

version: '3'

vars:
  BIN_NAME: spack-runtime
  COMPILER_BIN_NAME: spack-compiler
  DIST_DIR: dist
  GO_LDFLAGS: -s -w -buildid=
  GOYEK: go -C build run . --
  GORELEASER_VERSION: v2.15.4
  PERF_RESULTS_DIR: tmp/perf/results
  PERF_BENCH_COUNT: 5
  K6_HTML_PATHS: /,/index.html
  K6_JS_PATHS: /assets/app.8f3a1c2d.js,/assets/vendor.6d1e3a9b.js
  K6_CSS_PATHS: /assets/style.4b21c9aa.css
  K6_IMAGE_PATHS: /assets/hero.9d7f2a10.jpg,/assets/card.2e4c91ab.png,/assets/logo.1a2b3c4d.svg
  K6_OTHER_PATHS: /assets/font.7f6e5d4c.woff2,/manifest.webmanifest
  K6_FRONTEND_ASSET_PATHS: /assets/style.4b21c9aa.css,/assets/vendor.6d1e3a9b.js,/assets/app.8f3a1c2d.js,/assets/hero.9d7f2a10.jpg,/assets/card.2e4c91ab.png,/assets/logo.1a2b3c4d.svg,/assets/font.7f6e5d4c.woff2,/manifest.webmanifest
  K6_FRONTEND_PATHS: /,/index.html,/assets/app.8f3a1c2d.js,/assets/vendor.6d1e3a9b.js,/assets/style.4b21c9aa.css,/assets/hero.9d7f2a10.jpg,/assets/card.2e4c91ab.png,/assets/logo.1a2b3c4d.svg,/assets/font.7f6e5d4c.woff2,/manifest.webmanifest

tasks:
  default:
    desc: Run the default validation entry through goyek
    cmds:
      - '{{.GOYEK}} validate'

  dev:
    desc: development
    cmds:
      - cd test && pnpm build
      - go run github.com/air-verse/air@v1.62.0 .

  test:
    cmds:
      - '{{.GOYEK}} test'

  test-libvips:
    cmds:
      - '{{.GOYEK}} test-libvips'

  test:libvips:
    cmds:
      - '{{.GOYEK}} test-libvips'

  test:race:
    cmds:
      - go test -race ./...

  test:fuzz:parsers:
    desc: Run focused parser fuzzing for request path, Accept-Encoding, Accept, and Range handling
    cmds:
      - go test -run=Fuzz -fuzz=FuzzCleanDoesNotProduceEscapingPath -fuzztime=30s ./internal/requestpath
      - go test -run=Fuzz -fuzz=FuzzParseAcceptEncoding -fuzztime=30s ./internal/resolver
      - go test -run=Fuzz -fuzz=FuzzParseAcceptImageFormats -fuzztime=30s ./internal/resolver
      - go test -run=Fuzz -fuzz=FuzzHTTPRangeRequest -fuzztime=30s ./internal/server

  test:stress:catalog:
    desc: Run opt-in catalog scale stress test; set SPACK_STRESS_ASSET_COUNT=1000000 for 1M files
    cmds:
      - go test -tags=stress -run '^TestCatalogStressScan$' ./internal/sourcecatalog

  integration:container:smoke:
    desc: Build and black-box test the container with read-only rootfs and dropped capabilities
    cmds:
      - bash scripts/container-smoke.sh

  integration:aot:refine:smoke:
    desc: Build a Refine fixture, compile it to .spack, and smoke-test direct vs AOT runtime serving
    vars:
      K6_VUS: '{{default "1" .K6_VUS}}'
      K6_DURATION: '{{default "5s" .K6_DURATION}}'
      ACCEPT_ENCODING: '{{default "br,gzip" .ACCEPT_ENCODING}}'
      SPACK_IMAGE_ENABLE: '{{default "false" .SPACK_IMAGE_ENABLE}}'
      SPACK_IMAGE_WIDTHS: '{{default "320,640" .SPACK_IMAGE_WIDTHS}}'
      SPACK_IMAGE_FORMATS: '{{default "webp" .SPACK_IMAGE_FORMATS}}'
    env:
      K6_VUS: "{{.K6_VUS}}"
      K6_DURATION: "{{.K6_DURATION}}"
      ACCEPT_ENCODING: "{{.ACCEPT_ENCODING}}"
      SPACK_IMAGE_ENABLE: "{{.SPACK_IMAGE_ENABLE}}"
      SPACK_IMAGE_WIDTHS: "{{.SPACK_IMAGE_WIDTHS}}"
      SPACK_IMAGE_FORMATS: "{{.SPACK_IMAGE_FORMATS}}"
    cmds:
      - '{{.GOYEK}} refine-aot-smoke'

  clean:
    cmds:
      - rm -rf {{.DIST_DIR}}

  build:
    desc: 构建当前平台 runtime
    cmds:
      - '{{.GOYEK}} build'

  build:compiler:
    desc: 构建当前平台 compiler（需要 libvips/cgo）
    env:
      CGO_ENABLED: "1"
    cmds:
      - go build -tags=spack_libvips -trimpath -ldflags="{{.GO_LDFLAGS}}" -o {{.DIST_DIR}}/{{.COMPILER_BIN_NAME}} ./cmd/spack-compiler

  build:all:
    desc: 使用 GoReleaser 构建发布覆盖的平台快照
    cmds:
      - go run github.com/goreleaser/goreleaser/v2@{{.GORELEASER_VERSION}} build --snapshot --clean

  check:
    cmds:
      - go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

  lint:
    cmds:
      - '{{.GOYEK}} lint'

  validate:
    desc: Run the full local validation entry through goyek
    cmds:
      - '{{.GOYEK}} validate'

  security:govulncheck:
    cmds:
      - go tool govulncheck -scan=package ./...

  perf:bench:
    desc: 运行关键路径性能基线 benchmark
    cmds:
      - go test -run=TestDoesNotExist -bench='.' -benchmem -count=3 ./internal/catalog ./internal/resolver ./internal/assetcache ./internal/pipeline ./internal/server

  perf:bench:catalog:
    desc: 运行 catalog 索引/快照性能 benchmark
    cmds:
      - go test -run=TestDoesNotExist -bench='BenchmarkCatalog' -benchmem -count=3 ./internal/catalog

  perf:bench:prepared:
    desc: 运行 prepared snapshot/route 性能 benchmark
    cmds:
      - go test -run=TestDoesNotExist -bench='Benchmark(Prepared|HTTPPrepared)' -benchmem -count=3 ./internal/server

  serve:bench:
    desc: 在 127.0.0.1:8080 启动本地压测 runtime
    vars:
      ASSETS_ROOT: '{{default "test/build/dist" .ASSETS_ROOT}}'
    env:
      SPACK_ASSETS_ROOT: '{{.ASSETS_ROOT}}'
      SPACK_ASSETS_PATH: /
      SPACK_ASSETS_FALLBACK_TARGET: index.html
      SPACK_HTTP_PORT: "8080"
      SPACK_DEBUG_ENABLE: "false"
      SPACK_LOGGER_LEVEL: warn
      SPACK_HTTP_MEMORY_CACHE_ENABLE: "true"
      SPACK_HTTP_MEMORY_CACHE_WARMUP: "true"
      SPACK_HTTP_MEMORY_CACHE_MAX_FILE_SIZE: "65536"
    cmds:
      - go run ./cmd/spack-runtime

  perf:wrk:
    desc: 使用 wrk 压测本地 bench runtime；先运行 task serve:bench
    vars:
      WRK_THREADS: '{{default "8" .WRK_THREADS}}'
      WRK_CONNECTIONS: '{{default "256" .WRK_CONNECTIONS}}'
      WRK_DURATION: '{{default "30s" .WRK_DURATION}}'
      WRK_URL: '{{default "http://127.0.0.1:8080/" .WRK_URL}}'
    cmds:
      - wrk -t{{.WRK_THREADS}} -c{{.WRK_CONNECTIONS}} -d{{.WRK_DURATION}} {{.WRK_URL}}

  perf:contract:pr:
    desc: 运行 PR 级性能合同微基准并生成报告
    cmds:
      - '{{.GOYEK}} perfcontract'

  perfcontract:
    desc: Run the performance contract entry through goyek
    cmds:
      - '{{.GOYEK}} perfcontract'

  perf:contract:main:
    desc: 运行 main 分支性能合同并在存在 baseline 时做回归门禁
    vars:
      BASELINE: '{{default "performance/baselines/current/go-bench.txt" .BASELINE}}'
    cmds:
      - mkdir -p {{.PERF_RESULTS_DIR}}
      - go test -run=TestDoesNotExist -bench='Benchmark(Clean|Catalog|ResolverResolve|CacheGetOrLoad|HTTPAssetRoute|Prepared|HTTPPrepared|ServiceEnqueue)' -benchmem -count={{.PERF_BENCH_COUNT}} ./internal/requestpath ./internal/catalog ./internal/resolver ./internal/assetcache ./internal/server ./internal/pipeline | tee {{.PERF_RESULTS_DIR}}/go-bench.txt
      - go run ./cmd/perfcontract -budget performance/budgets.json -baseline {{.BASELINE}} -candidate {{.PERF_RESULTS_DIR}}/go-bench.txt -out {{.PERF_RESULTS_DIR}}/performance-report.md -metadata {{.PERF_RESULTS_DIR}}/metadata.json

  perf:contract:release:
    desc: 运行 release 性能合同，包含 Go 微基准和 k6 固定 workload
    cmds:
      - task: perf:contract:main
      - task: perf:k6:frontend
      - task: perf:k6:split
      - go run ./cmd/perfcontract -budget performance/budgets.json -baseline performance/baselines/current/go-bench.txt -candidate {{.PERF_RESULTS_DIR}}/go-bench.txt -k6-dir tmp/k6/results -out {{.PERF_RESULTS_DIR}}/performance-report.md -metadata {{.PERF_RESULTS_DIR}}/metadata.json

  perf:bench:static:
    desc: 对比 spack 与 nginx 的真实 HTTP 静态文件 benchmark（需要 Docker）
    cmds:
      - go test -tags=integration -run=TestDoesNotExist -bench='BenchmarkStaticFileServers' -benchmem ./internal/staticbench

  perf:k6:prepare:
    desc: 准备 k6 静态压测资产和本地 SPACK 镜像
    vars:
      BENCH_GOARCH: '{{default "amd64" .BENCH_GOARCH}}'
    cmds:
      - go run ./cmd/benchassets --out tmp/k6/assets --goarch {{.BENCH_GOARCH}}
      - task: perf:k6:build:linux
        vars:
          BENCH_GOARCH: '{{.BENCH_GOARCH}}'
      - docker build --build-arg TARGETPLATFORM=linux/{{.BENCH_GOARCH}} -t spack-k6-bench:local -f docker/debian.Dockerfile tmp/k6

  perf:k6:build:linux:
    internal: true
    vars:
      BENCH_GOARCH: '{{default "amd64" .BENCH_GOARCH}}'
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: "{{.BENCH_GOARCH}}"
    cmds:
      - go build -trimpath -ldflags="{{.GO_LDFLAGS}}" -o tmp/k6/linux/{{.BENCH_GOARCH}}/spack-runtime ./cmd/spack-runtime

  perf:k6:
    desc: 使用 k6 + Docker 对比 spack 与 nginx 的完整 HTTP 静态文件压测
    vars:
      K6_VUS: '{{default "64" .K6_VUS}}'
      K6_DURATION: '{{default "30s" .K6_DURATION}}'
      ACCEPT_ENCODING: '{{default "identity" .ACCEPT_ENCODING}}'
    cmds:
      - task: perf:k6:prepare
      - task: perf:k6:up
      - task: perf:k6:run:static
        vars: { BENCH_NAME: spack, TARGET_URL: "http://spack:80", SUMMARY: spack.json, BENCH_PATHS: "{{.K6_FRONTEND_PATHS}}", K6_VUS: "{{.K6_VUS}}", K6_DURATION: "{{.K6_DURATION}}", ACCEPT_ENCODING: "{{.ACCEPT_ENCODING}}" }
      - task: perf:k6:run:static
        vars: { BENCH_NAME: nginx, TARGET_URL: "http://nginx:8080", SUMMARY: nginx.json, BENCH_PATHS: "{{.K6_FRONTEND_PATHS}}", K6_VUS: "{{.K6_VUS}}", K6_DURATION: "{{.K6_DURATION}}", ACCEPT_ENCODING: "{{.ACCEPT_ENCODING}}" }
      - task: perf:k6:down

  perf:k6:frontend:
    desc: 使用 k6 模拟完整前端页面加载，并比较 spack、nginx
    vars:
      K6_VUS: '{{default "64" .K6_VUS}}'
      K6_DURATION: '{{default "30s" .K6_DURATION}}'
      ACCEPT_ENCODING: '{{default "identity" .ACCEPT_ENCODING}}'
    cmds:
      - task: perf:k6:prepare
      - task: perf:k6:up
      - task: perf:k6:run:frontend
        vars: { BENCH_NAME: spack, TARGET_URL: "http://spack:80", SUMMARY: spack-frontend.json, K6_VUS: "{{.K6_VUS}}", K6_DURATION: "{{.K6_DURATION}}", ACCEPT_ENCODING: "{{.ACCEPT_ENCODING}}" }
      - task: perf:k6:run:frontend
        vars: { BENCH_NAME: nginx, TARGET_URL: "http://nginx:8080", SUMMARY: nginx-frontend.json, K6_VUS: "{{.K6_VUS}}", K6_DURATION: "{{.K6_DURATION}}", ACCEPT_ENCODING: "{{.ACCEPT_ENCODING}}" }
      - task: perf:k6:down

  perf:k6:split:
    desc: 按 HTML、JS、CSS、图片、其他前端资源分别运行 k6 压测
    vars:
      K6_VUS: '{{default "64" .K6_VUS}}'
      K6_DURATION: '{{default "15s" .K6_DURATION}}'
      ACCEPT_ENCODING: '{{default "identity" .ACCEPT_ENCODING}}'
    cmds:
      - task: perf:k6:prepare
      - task: perf:k6:up
      - task: perf:k6:run:group
        vars: { GROUP: html, BENCH_PATHS: "{{.K6_HTML_PATHS}}", K6_VUS: "{{.K6_VUS}}", K6_DURATION: "{{.K6_DURATION}}", ACCEPT_ENCODING: "{{.ACCEPT_ENCODING}}" }
      - task: perf:k6:run:group
        vars: { GROUP: js, BENCH_PATHS: "{{.K6_JS_PATHS}}", K6_VUS: "{{.K6_VUS}}", K6_DURATION: "{{.K6_DURATION}}", ACCEPT_ENCODING: "{{.ACCEPT_ENCODING}}" }
      - task: perf:k6:run:group
        vars: { GROUP: css, BENCH_PATHS: "{{.K6_CSS_PATHS}}", K6_VUS: "{{.K6_VUS}}", K6_DURATION: "{{.K6_DURATION}}", ACCEPT_ENCODING: "{{.ACCEPT_ENCODING}}" }
      - task: perf:k6:run:group
        vars: { GROUP: images, BENCH_PATHS: "{{.K6_IMAGE_PATHS}}", K6_VUS: "{{.K6_VUS}}", K6_DURATION: "{{.K6_DURATION}}", ACCEPT_ENCODING: "{{.ACCEPT_ENCODING}}" }
      - task: perf:k6:run:group
        vars: { GROUP: other, BENCH_PATHS: "{{.K6_OTHER_PATHS}}", K6_VUS: "{{.K6_VUS}}", K6_DURATION: "{{.K6_DURATION}}", ACCEPT_ENCODING: "{{.ACCEPT_ENCODING}}" }
      - task: perf:k6:down

  perf:aot:refine:
    desc: 使用真实 Refine dist 对比 direct runtime 与 compiler .spack AOT runtime
    vars:
      K6_VUS: '{{default "64" .K6_VUS}}'
      K6_DURATION: '{{default "30s" .K6_DURATION}}'
      ACCEPT_ENCODING: '{{default "br,gzip" .ACCEPT_ENCODING}}'
      SPACK_IMAGE_ENABLE: '{{default "false" .SPACK_IMAGE_ENABLE}}'
      SPACK_IMAGE_WIDTHS: '{{default "320,640" .SPACK_IMAGE_WIDTHS}}'
      SPACK_IMAGE_FORMATS: '{{default "webp" .SPACK_IMAGE_FORMATS}}'
    env:
      K6_VUS: "{{.K6_VUS}}"
      K6_DURATION: "{{.K6_DURATION}}"
      ACCEPT_ENCODING: "{{.ACCEPT_ENCODING}}"
      SPACK_IMAGE_ENABLE: "{{.SPACK_IMAGE_ENABLE}}"
      SPACK_IMAGE_WIDTHS: "{{.SPACK_IMAGE_WIDTHS}}"
      SPACK_IMAGE_FORMATS: "{{.SPACK_IMAGE_FORMATS}}"
    cmds:
      - '{{.GOYEK}} refine-aot-perf'


  perf:aot:refine:matrix:
    desc: 运行真实 Refine dist 对比 direct runtime/AOT 与 nginx/caddy 的并发阶梯压测
    vars:
      REFINE_AOT_CONCURRENCIES: '{{default "1,8,64,256,1024" .REFINE_AOT_CONCURRENCIES}}'
      REFINE_BENCH_TARGETS: '{{default "direct,aot,caddy,nginx" .REFINE_BENCH_TARGETS}}'
      K6_DURATION: '{{default "30s" .K6_DURATION}}'
      ACCEPT_ENCODING: '{{default "br,gzip" .ACCEPT_ENCODING}}'
      SPACK_IMAGE_ENABLE: '{{default "false" .SPACK_IMAGE_ENABLE}}'
      SPACK_IMAGE_WIDTHS: '{{default "320,640" .SPACK_IMAGE_WIDTHS}}'
      SPACK_IMAGE_FORMATS: '{{default "webp" .SPACK_IMAGE_FORMATS}}'
    env:
      REFINE_AOT_CONCURRENCIES: "{{.REFINE_AOT_CONCURRENCIES}}"
      REFINE_BENCH_TARGETS: "{{.REFINE_BENCH_TARGETS}}"
      K6_DURATION: "{{.K6_DURATION}}"
      ACCEPT_ENCODING: "{{.ACCEPT_ENCODING}}"
      SPACK_IMAGE_ENABLE: "{{.SPACK_IMAGE_ENABLE}}"
      SPACK_IMAGE_WIDTHS: "{{.SPACK_IMAGE_WIDTHS}}"
      SPACK_IMAGE_FORMATS: "{{.SPACK_IMAGE_FORMATS}}"
    cmds:
      - bash scripts/refine-aot-bench-matrix.sh matrix

  perf:aot:refine:repeat:
    desc: 运行真实 Refine dist 的固定并发多轮采样
    vars:
      SPACK_AOT_REPEAT_ROUNDS: '{{default "3" .SPACK_AOT_REPEAT_ROUNDS}}'
      K6_VUS: '{{default "64" .K6_VUS}}'
      K6_DURATION: '{{default "30s" .K6_DURATION}}'
      ACCEPT_ENCODING: '{{default "br,gzip" .ACCEPT_ENCODING}}'
      SPACK_IMAGE_ENABLE: '{{default "false" .SPACK_IMAGE_ENABLE}}'
      SPACK_IMAGE_WIDTHS: '{{default "320,640" .SPACK_IMAGE_WIDTHS}}'
      SPACK_IMAGE_FORMATS: '{{default "webp" .SPACK_IMAGE_FORMATS}}'
    env:
      SPACK_AOT_REPEAT_ROUNDS: "{{.SPACK_AOT_REPEAT_ROUNDS}}"
      K6_VUS: "{{.K6_VUS}}"
      K6_DURATION: "{{.K6_DURATION}}"
      ACCEPT_ENCODING: "{{.ACCEPT_ENCODING}}"
      SPACK_IMAGE_ENABLE: "{{.SPACK_IMAGE_ENABLE}}"
      SPACK_IMAGE_WIDTHS: "{{.SPACK_IMAGE_WIDTHS}}"
      SPACK_IMAGE_FORMATS: "{{.SPACK_IMAGE_FORMATS}}"
    cmds:
      - bash scripts/refine-aot-bench-matrix.sh repeat

  perf:aot:refine:report:
    desc: 汇总 Refine AOT matrix/repeat benchmark 结果并生成 Markdown/JSON 报告
    vars:
      REFINE_AOT_RESULTS_DIR: '{{default "tmp/k6/results" .REFINE_AOT_RESULTS_DIR}}'
      REFINE_AOT_REPORT_PREFIX: '{{default "refine-aot-comparison-report" .REFINE_AOT_REPORT_PREFIX}}'
    env:
      REFINE_AOT_RESULTS_DIR: "{{.REFINE_AOT_RESULTS_DIR}}"
      REFINE_AOT_REPORT_PREFIX: "{{.REFINE_AOT_REPORT_PREFIX}}"
    cmds:
      - node scripts/refine-aot-bench-report.mjs

  perf:aot:refine:stress:
    desc: 使用真实 Refine dist 对比 direct runtime 与 compiler 容器 AOT runtime 的高并发压力测试
    vars:
      K6_VUS: '{{default "256" .K6_VUS}}'
      K6_DURATION: '{{default "2m" .K6_DURATION}}'
      ACCEPT_ENCODING: '{{default "br,gzip" .ACCEPT_ENCODING}}'
      SPACK_IMAGE_ENABLE: '{{default "false" .SPACK_IMAGE_ENABLE}}'
      SPACK_IMAGE_WIDTHS: '{{default "320,640" .SPACK_IMAGE_WIDTHS}}'
      SPACK_IMAGE_FORMATS: '{{default "webp" .SPACK_IMAGE_FORMATS}}'
    env:
      K6_VUS: "{{.K6_VUS}}"
      K6_DURATION: "{{.K6_DURATION}}"
      ACCEPT_ENCODING: "{{.ACCEPT_ENCODING}}"
      SPACK_IMAGE_ENABLE: "{{.SPACK_IMAGE_ENABLE}}"
      SPACK_IMAGE_WIDTHS: "{{.SPACK_IMAGE_WIDTHS}}"
      SPACK_IMAGE_FORMATS: "{{.SPACK_IMAGE_FORMATS}}"
    cmds:
      - '{{.GOYEK}} refine-aot-stress'

  perf:aot:refine:prepare:
    desc: 准备 Refine dist、AOT bundle 和本地 runtime bench 镜像
    cmds:
      - '{{.GOYEK}} refine-aot-prepare'

  perf:aot:refine:down:
    desc: 清理 Refine AOT benchmark 容器和网络
    cmds:
      - '{{.GOYEK}} refine-aot-down'

  refine-aot-prepare:
    desc: Prepare Refine AOT benchmark assets through goyek
    cmds:
      - '{{.GOYEK}} refine-aot-prepare'

  refine-aot-smoke:
    desc: Run the Refine AOT smoke benchmark through goyek
    cmds:
      - '{{.GOYEK}} refine-aot-smoke'

  refine-aot-perf:
    desc: Run the Refine AOT performance benchmark through goyek
    cmds:
      - '{{.GOYEK}} refine-aot-perf'

  refine-aot-stress:
    desc: Run the Refine AOT stress benchmark through goyek
    cmds:
      - '{{.GOYEK}} refine-aot-stress'

  refine-aot-down:
    desc: Stop Refine AOT benchmark resources through goyek
    cmds:
      - '{{.GOYEK}} refine-aot-down'

  perf:k6:up:
    internal: true
    cmds:
      - docker compose -f deploy/bench/docker-compose.k6.yml up -d spack nginx

  perf:k6:run:frontend:
    internal: true
    vars:
      BENCH_NAME: '{{.BENCH_NAME}}'
      TARGET_URL: '{{.TARGET_URL}}'
      SUMMARY: '{{.SUMMARY}}'
      PAGE_PATH: '{{default "/" .PAGE_PATH}}'
      ASSET_PATHS: '{{default .K6_FRONTEND_ASSET_PATHS .ASSET_PATHS}}'
      K6_VUS: '{{default "64" .K6_VUS}}'
      K6_DURATION: '{{default "30s" .K6_DURATION}}'
      ACCEPT_ENCODING: '{{default "identity" .ACCEPT_ENCODING}}'
    cmds:
      - docker compose -f deploy/bench/docker-compose.k6.yml run --rm -e BENCH_NAME={{.BENCH_NAME}} -e TARGET_URL={{.TARGET_URL}} -e PAGE_PATH={{.PAGE_PATH}} -e ASSET_PATHS={{.ASSET_PATHS}} -e VUS={{.K6_VUS}} -e DURATION={{.K6_DURATION}} -e ACCEPT_ENCODING={{.ACCEPT_ENCODING}} k6 run --summary-export /results/{{.SUMMARY}} /scripts/frontend-page.js

  perf:k6:run:static:
    internal: true
    vars:
      BENCH_NAME: '{{.BENCH_NAME}}'
      TARGET_URL: '{{.TARGET_URL}}'
      SUMMARY: '{{.SUMMARY}}'
      BENCH_PATHS: '{{.BENCH_PATHS}}'
      K6_VUS: '{{default "64" .K6_VUS}}'
      K6_DURATION: '{{default "30s" .K6_DURATION}}'
      ACCEPT_ENCODING: '{{default "identity" .ACCEPT_ENCODING}}'
    cmds:
      - docker compose -f deploy/bench/docker-compose.k6.yml run --rm -e BENCH_NAME={{.BENCH_NAME}} -e TARGET_URL={{.TARGET_URL}} -e BENCH_PATHS={{.BENCH_PATHS}} -e VUS={{.K6_VUS}} -e DURATION={{.K6_DURATION}} -e ACCEPT_ENCODING={{.ACCEPT_ENCODING}} k6 run --summary-export /results/{{.SUMMARY}} /scripts/static-assets.js

  perf:k6:run:group:
    internal: true
    vars:
      GROUP: '{{.GROUP}}'
      BENCH_PATHS: '{{.BENCH_PATHS}}'
      K6_VUS: '{{default "64" .K6_VUS}}'
      K6_DURATION: '{{default "15s" .K6_DURATION}}'
      ACCEPT_ENCODING: '{{default "identity" .ACCEPT_ENCODING}}'
    cmds:
      - task: perf:k6:run:static
        vars: { BENCH_NAME: spack, TARGET_URL: "http://spack:80", SUMMARY: "spack-{{.GROUP}}.json", BENCH_PATHS: "{{.BENCH_PATHS}}", K6_VUS: "{{.K6_VUS}}", K6_DURATION: "{{.K6_DURATION}}", ACCEPT_ENCODING: "{{.ACCEPT_ENCODING}}" }
      - task: perf:k6:run:static
        vars: { BENCH_NAME: nginx, TARGET_URL: "http://nginx:8080", SUMMARY: "nginx-{{.GROUP}}.json", BENCH_PATHS: "{{.BENCH_PATHS}}", K6_VUS: "{{.K6_VUS}}", K6_DURATION: "{{.K6_DURATION}}", ACCEPT_ENCODING: "{{.ACCEPT_ENCODING}}" }

  perf:k6:down:
    desc: 清理 k6 静态压测容器和网络
    cmds:
      - docker compose -f deploy/bench/docker-compose.k6.yml down -v --remove-orphans

  perf:profile:resolver:
    desc: 生成 resolver 基线 CPU/内存 profile
    cmds:
      - mkdir -p tmp/perf
      - go test -run=TestDoesNotExist -bench='BenchmarkResolverResolve' -benchmem -count=1 -cpuprofile tmp/perf/resolver.cpu.pprof -memprofile tmp/perf/resolver.mem.pprof ./internal/resolver

  perf:profile:cache:
    desc: 生成 asset cache 基线 CPU/内存 profile
    cmds:
      - mkdir -p tmp/perf
      - go test -run=TestDoesNotExist -bench='BenchmarkCacheGetOrLoad' -benchmem -count=1 -cpuprofile tmp/perf/cache.cpu.pprof -memprofile tmp/perf/cache.mem.pprof ./internal/assetcache

  perf:profile:pipeline:
    desc: 生成 pipeline enqueue 基线 CPU/内存 profile
    cmds:
      - mkdir -p tmp/perf
      - go test -run=TestDoesNotExist -bench='BenchmarkServiceEnqueue' -benchmem -count=1 -cpuprofile tmp/perf/pipeline.cpu.pprof -memprofile tmp/perf/pipeline.mem.pprof ./internal/pipeline

  perf:profile:http:
    desc: 生成 HTTP 资产路由基线 CPU/内存 profile
    cmds:
      - mkdir -p tmp/perf
      - go test -run=TestDoesNotExist -bench='BenchmarkHTTPAssetRoute' -benchmem -count=1 -cpuprofile tmp/perf/http.cpu.pprof -memprofile tmp/perf/http.mem.pprof ./internal/server

  release:tag:
    desc: "创建注释标签（用法: task release:tag VERSION=0.1.0）"
    requires:
      vars: [ VERSION ]
    vars:
      TAG: '{{if hasPrefix .VERSION "v"}}{{.VERSION}}{{else}}v{{.VERSION}}{{end}}'
    cmds:
      - git tag -a {{.TAG}} -m "release {{.TAG}}"

  release:goreleaser:check:
    desc: "校验 .goreleaser.yml 配置"
    cmds:
      - go run github.com/goreleaser/goreleaser/v2@{{.GORELEASER_VERSION}} check

  release:preflight:
    desc: "校验 release 前的 root/build/workspace 依赖状态"
    cmds:
      - go mod tidy -diff
      - go -C build mod tidy -diff
      - go work sync
      - git diff --exit-code -- go.mod go.sum build/go.mod build/go.sum go.work go.work.sum

  release:goreleaser:snapshot:
    desc: "使用 GoReleaser 执行本地快照构建（不发布）"
    cmds:
      - go run github.com/goreleaser/goreleaser/v2@{{.GORELEASER_VERSION}} release --snapshot --clean --skip=publish

  release:local:
    desc: "本地完整发布当前 tag：GitHub Release、安装包、runtime/compiler 镜像"
    env:
      GORELEASER_VERSION: '{{.GORELEASER_VERSION}}'
      SPACK_RELEASE_TAG: '{{default "" .SPACK_RELEASE_TAG}}'
      SPACK_RUNTIME_PLATFORMS: '{{default "linux/amd64,linux/arm64" .SPACK_RUNTIME_PLATFORMS}}'
      SPACK_COMPILER_PLATFORMS: '{{default "linux/amd64" .SPACK_COMPILER_PLATFORMS}}'
      SPACK_ALPINE_PLATFORMS: '{{default "linux/amd64" .SPACK_ALPINE_PLATFORMS}}'
    cmds:
      - '{{.GOYEK}} release-local'

  release:verify:
    desc: "拉取并黑盒验证已发布 runtime/compiler 镜像"
    env:
      SPACK_RELEASE_TAG: '{{default "" .SPACK_RELEASE_TAG}}'
      SPACK_VERIFY_RUNTIME_IMAGE: '{{default "" .SPACK_VERIFY_RUNTIME_IMAGE}}'
      SPACK_VERIFY_COMPILER_IMAGE: '{{default "" .SPACK_VERIFY_COMPILER_IMAGE}}'
      SPACK_VERIFY_ALPINE_IMAGE: '{{default "" .SPACK_VERIFY_ALPINE_IMAGE}}'
      SPACK_IMAGE_ENABLE: '{{default "false" .SPACK_IMAGE_ENABLE}}'
      SPACK_IMAGE_WIDTHS: '{{default "320,640" .SPACK_IMAGE_WIDTHS}}'
      SPACK_IMAGE_FORMATS: '{{default "webp" .SPACK_IMAGE_FORMATS}}'
    cmds:
      - '{{.GOYEK}} release-verify'

  release:
    desc: "创建并推送当前分支与标签（用法: task release VERSION=0.1.0）"
    requires:
      vars: [ VERSION ]
    vars:
      TAG: '{{if hasPrefix .VERSION "v"}}{{.VERSION}}{{else}}v{{.VERSION}}{{end}}'
    cmds:
      - task: release:preflight
      - task: release:goreleaser:check
      - task: release:tag
        vars:
          VERSION: '{{.VERSION}}'
      - git push origin HEAD
      - git push origin {{.TAG}}

  release:bump:major:
    desc: "自动递增 major 并发布（用法: task release:bump:major）"
    vars:
      LATEST_TAG:
        sh: git describe --tags --abbrev=0 --match "v[0-9]*"
      VERSION: '{{ $parts := splitList "." (trimPrefix "v" .LATEST_TAG) }}{{ printf "%d.0.0" (add (atoi (index $parts 0)) 1) }}'
    cmds:
      - task: release
        vars:
          VERSION: '{{.VERSION}}'

  release:bump:minor:
    desc: "自动递增 minor 并发布（用法: task release:bump:minor）"
    vars:
      LATEST_TAG:
        sh: git describe --tags --abbrev=0 --match "v[0-9]*"
      VERSION: '{{ $parts := splitList "." (trimPrefix "v" .LATEST_TAG) }}{{ printf "%s.%d.0" (index $parts 0) (add (atoi (index $parts 1)) 1) }}'
    cmds:
      - task: release
        vars:
          VERSION: '{{.VERSION}}'

  release:bump:patch:
    desc: "自动递增 patch 并发布（用法: task release:bump:patch）"
    vars:
      LATEST_TAG:
        sh: git describe --tags --abbrev=0 --match "v[0-9]*"
      VERSION: '{{ $parts := splitList "." (trimPrefix "v" .LATEST_TAG) }}{{ printf "%s.%s.%d" (index $parts 0) (index $parts 1) (add (atoi (index $parts 2)) 1) }}'
    cmds:
      - task: release
        vars:
          VERSION: '{{.VERSION}}'
  perf:aot:refine:baseline:
    desc: Run the multi-round Refine AOT performance baseline
    env:
      SPACK_PERF_ROUNDS: '{{default "3" .SPACK_PERF_ROUNDS}}'
      K6_VUS: '{{default "256" .K6_VUS}}'
      K6_DURATION: '{{default "2m" .K6_DURATION}}'
      ACCEPT_ENCODING: '{{default "br,gzip" .ACCEPT_ENCODING}}'
    cmds:
      - '{{.GOYEK}} refine-aot-baseline'

  refine-aot-baseline:
    internal: true
    cmds:
      - '{{.GOYEK}} refine-aot-baseline'
