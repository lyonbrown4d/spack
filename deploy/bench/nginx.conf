worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;

    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
